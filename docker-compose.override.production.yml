services:
  db_backend:
    ports:
      - 3306:3306

  db_backup:
    build:
      context: ./build/db_backup
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    container_name: ${COMPOSE_PROJECT_NAME}-db_backup
    volumes:
      - ./backups:/backups
    networks:
      - backend
    depends_on:
      - db_backend
    environment:
      MYSQL_HOST: db_backend
      MYSQL_USER: ${BACKEND_DB_USER}
      MYSQL_PASSWORD: ${BACKEND_DB_PASSWORD}
      MYSQL_DATABASE: ${BACKEND_DB}

  php_backend:
    build:
      context: .
      args:
        INSTALL_XDEBUG: false
    volumes:
      - ./src/backend:/var/www/backend/current/:cached

  php_worker:
    build:
      context: .
    volumes:
      - ./src/backend:/var/www/backend/current/:cached

  certbot:
    build:
      context: ./build/certbot
    container_name: ${COMPOSE_PROJECT_NAME}-certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certs:/etc/nginx/certs
      - ./certbot:/var/www/certbot
    environment:
      BACKEND_SERVER_NAME: "bakosdietas.hu"

  webserver:
    depends_on:
      - certbot
    volumes:
      - ./src/backend:/var/www/backend/current/:cached
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certs:/etc/nginx/certs
      - ./certbot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_SERVER_NAME: "bakosdietas.hu"